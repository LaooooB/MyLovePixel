name: Windows Self-Contained Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ui-dark-release-build
      - ui-full-ux-build
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'MyLovePixel.slnx'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore MyLovePixel.slnx

      - name: Build solution
        run: dotnet build MyLovePixel.slnx -c Release --no-restore

      - name: Test solution
        run: dotnet test MyLovePixel.slnx -c Release --no-build --no-restore

      - name: Publish Windows x64 self-contained app
        shell: pwsh
        run: |
          $publish = 'release/MyLovePixel-Windows-x64'
          New-Item -ItemType Directory -Force $publish | Out-Null
          dotnet publish src/MyLovePixel.Desktop/MyLovePixel.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

      - name: Sign Windows executable when certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            Write-Host '::warning::No Windows signing certificate is configured. This build remains unsigned and Windows SmartScreen may ask for trust.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'WINDOWS_SIGNING_PFX_PASSWORD is required when WINDOWS_SIGNING_PFX_BASE64 is configured.'
          }

          $exe = Resolve-Path 'release/MyLovePixel-Windows-x64/MyLovePixel.Desktop.exe'
          $pfx = Join-Path $env:RUNNER_TEMP 'MyLovePixel-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) { throw 'signtool.exe was not found on the runner.' }

            & $signTool.FullName sign `
              /fd SHA256 `
              /f $pfx `
              /p $env:WINDOWS_SIGNING_PFX_PASSWORD `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }

            & $signTool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          }
          finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }

      - name: Validate release payload
        shell: pwsh
        run: |
          $publish = 'release/MyLovePixel-Windows-x64'
          Get-ChildItem $publish -Filter '*.pdb' -File | Remove-Item -Force
          $exe = Join-Path $publish 'MyLovePixel.Desktop.exe'
          if (-not (Test-Path $exe)) { throw 'MyLovePixel.Desktop.exe was not produced.' }
          $exeInfo = Get-Item $exe
          if ($exeInfo.Length -lt 1MB) { throw "MyLovePixel.Desktop.exe is unexpectedly small: $($exeInfo.Length) bytes" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature $exe
          $signatureText = if ($signature.Status -eq 'Valid') {
            "signed ($($signature.SignerCertificate.Subject))"
          } else {
            'unsigned'
          }
          @(
            "MyLovePixel Windows x64",
            "Commit: $env:GITHUB_SHA",
            "Built: $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssK')",
            "Runtime: self-contained .NET 10",
            "Executable: MyLovePixel.Desktop.exe",
            "Signature: $signatureText"
          ) | Set-Content -Encoding UTF8 (Join-Path $publish 'BUILD.txt')
          "$hash  MyLovePixel.Desktop.exe" | Set-Content -Encoding ASCII (Join-Path $publish 'SHA256SUMS.txt')
          $files = Get-ChildItem $publish -File
          if ($files.Name | Where-Object { $_ -ne 'MyLovePixel.Desktop.exe' -and $_ -ne 'BUILD.txt' -and $_ -ne 'SHA256SUMS.txt' }) {
            throw 'Release payload contains unexpected files.'
          }
          Get-ChildItem $publish | Format-Table Name, Length

      - name: Smoke test packaged app startup
        shell: pwsh
        run: |
          $exe = Resolve-Path 'release/MyLovePixel-Windows-x64/MyLovePixel.Desktop.exe'
          $crashLog = Join-Path $env:LOCALAPPDATA 'MyLovePixel/crash.log'
          if (Test-Path $crashLog) { Remove-Item $crashLog -Force }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) {
            if (Test-Path $crashLog) {
              Write-Host '--- crash.log ---'
              Get-Content $crashLog
              Write-Host '--- end crash.log ---'
            }
            throw "Packaged app exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          Write-Host 'Packaged app stayed alive through startup smoke test.'

      - name: Package Windows release
        shell: pwsh
        run: |
          $zip = 'release/MyLovePixel-Windows-x64.zip'
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path 'release/MyLovePixel-Windows-x64/*' -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Release ZIP was not produced.' }

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: MyLovePixel-Windows-x64
          path: release/MyLovePixel-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
