name: UX Release Validation
on:
  workflow_dispatch:
  push:
    branches: [ux-release-p0-p1-20260926]
    paths: ['src/**', 'tests/**', 'scripts/ux/**', '.github/workflows/ux-validation.yml', 'Directory.*.props', 'MyLovePixel.slnx']
permissions:
  contents: write
concurrency:
  group: ux-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Apply reviewed source edits
        shell: pwsh
        run: |
          if (Test-Path 'scripts/ux/apply.py') {
            python scripts/ux/apply.py
            if ($LASTEXITCODE -ne 0) { throw 'Source patch failed' }
            git add src tests Directory.Packages.props MyLovePixel.slnx docs
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 1) {
              git -c user.name='MyLovePixel build' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply UX source changes'
              git push origin HEAD:ux-release-p0-p1-20260926
              if ($LASTEXITCODE -ne 0) { throw 'Source commit push failed' }
            }
          }
          New-Item -ItemType Directory -Force validation | Out-Null
          git rev-parse HEAD | Set-Content validation/source-sha.txt
      - name: Build
        shell: pwsh
        run: |
          dotnet build MyLovePixel.slnx -c Release 2>&1 | Tee-Object validation/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Tests
        shell: pwsh
        run: |
          dotnet test MyLovePixel.slnx -c Release --no-build 2>&1 | Tee-Object validation/tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Desktop interaction and layout regression
        shell: pwsh
        run: |
          if (Test-Path 'tests/MyLovePixel.Desktop.UxTests/MyLovePixel.Desktop.UxTests.csproj') {
            dotnet run --project tests/MyLovePixel.Desktop.UxTests -c Release -- validation 2>&1 | Tee-Object validation/desktop.txt
            if ($LASTEXITCODE -ne 0) { throw 'Desktop UX regression failed' }
          }
      - name: Validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-validation
          path: validation
          if-no-files-found: error
