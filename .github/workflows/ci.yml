name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MyLovePixel.slnx
      - run: dotnet build MyLovePixel.slnx --no-restore
      - run: dotnet test MyLovePixel.slnx --no-build
