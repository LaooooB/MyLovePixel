name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Integrate pinned UX source during migration
        run: |
          if [ -f tools/ux-upgrade/apply.py ]; then python3 tools/ux-upgrade/apply.py; fi
      - run: dotnet restore MyLovePixel.slnx
      - run: dotnet build MyLovePixel.slnx --no-restore
      - run: dotnet test MyLovePixel.slnx --no-build
