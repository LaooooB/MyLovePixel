name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply verified source transport when present
        run: |
          if [ -f tools/performance-upgrade/apply.py ]; then python3 tools/performance-upgrade/apply.py; fi
      - run: dotnet restore MyLovePixel.slnx
      - run: dotnet build MyLovePixel.slnx --no-restore
      - run: dotnet test MyLovePixel.slnx --no-build
