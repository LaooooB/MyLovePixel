name: Color Library Validation
on:
  workflow_dispatch:
  push:
    branches: [color-library-upgrade-20261008]
permissions:
  contents: read
concurrency:
  group: color-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=MyLovePixel-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: MyLovePixel-source
          path: MyLovePixel-source.zip
          retention-days: 7
          if-no-files-found: error
  bootstrap-tools:
    if: contains(github.event.head_commit.message, '[bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated dependency paths
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/color-library-dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/color-library-nuget" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - run: dotnet restore MyLovePixel.slnx
      - name: Package isolated offline build dependencies
        run: |
          tar -C "$RUNNER_TEMP" -cf - color-library-dotnet color-library-nuget | gzip -1 | split -b 300M -d - build-tools.part
          du -h build-tools.part*
      - uses: actions/upload-artifact@v4
        with:
          name: build-tools-00
          path: build-tools.part00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: build-tools-01
          path: build-tools.part01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: build-tools-02
          path: build-tools.part02
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: build-tools-03
          path: build-tools.part03
          retention-days: 1
          compression-level: 0
