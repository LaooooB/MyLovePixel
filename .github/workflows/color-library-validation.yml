name: Color Library Validation
on:
  workflow_dispatch:
  push:
    branches: [color-library-upgrade-20261008]
permissions:
  contents: read
concurrency:
  group: color-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source revision
        run: git archive --format=zip --output=MyLovePixel-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: MyLovePixel-source
          path: MyLovePixel-source.zip
          retention-days: 7
          if-no-files-found: error
  bootstrap-tools:
    if: contains(github.event.head_commit.message, '[bootstrap]')
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/color-library-dotnet
      NUGET_PACKAGES: ${{ runner.temp }}/color-library-nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - run: dotnet restore MyLovePixel.slnx
      - name: Package isolated offline build dependencies
        run: tar -C "$RUNNER_TEMP" -cf - color-library-dotnet color-library-nuget | gzip -1 > MyLovePixel-build-tools.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: MyLovePixel-offline-build-tools
          path: MyLovePixel-build-tools.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
