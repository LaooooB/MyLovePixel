name: Export pinned UX comparison sources
on:
  push:
    branches: ['perf/input-latency-20261008']
    paths: ['.github/workflows/source-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export the two requested revisions
        run: |
          mkdir -p /tmp/ux-sources
          git archive --format=zip 8e29cf38d9ee9a73c2341bd51309ae521d460bdc > /tmp/ux-sources/current.zip
          git archive --format=zip 5572f9735a71dd663d292a914be040aa8638d864 > /tmp/ux-sources/reference-5572f97.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-ux-sources
          path: /tmp/ux-sources/
          retention-days: 7
