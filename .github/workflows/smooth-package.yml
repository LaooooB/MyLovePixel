name: Smooth input and Windows package
on:
  push:
    branches: ['perf/input-latency-20261008']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop
        run: dotnet build src/MyLovePixel.Desktop/MyLovePixel.Desktop.csproj -c Release
      - name: Check retained colors and basic editing
        run: dotnet run --project tests/MyLovePixel.UxSmoke -c Release -- artifacts/ux
      - name: Check pan, zoom, hover and stable controls
        run: dotnet run --project tests/MyLovePixel.PerformanceSmoke -c Release -- artifacts/checks
      - name: Publish portable executable
        shell: pwsh
        run: |
          dotnet publish src/MyLovePixel.Desktop/MyLovePixel.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o artifacts/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/windows/
          Get-ChildItem artifacts/windows -Filter *.pdb | Remove-Item
          (Get-FileHash artifacts/windows/MyLovePixel.Desktop.exe -Algorithm SHA256).Hash | Set-Content artifacts/windows/SHA256.txt
          git rev-parse HEAD | Set-Content artifacts/windows/BUILD_COMMIT.txt
          git archive --format=zip --output=artifacts/source.zip HEAD
      - name: Open and close the actual EXE
        shell: pwsh
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process (Resolve-Path artifacts/windows/MyLovePixel.Desktop.exe) -PassThru
          $ready = $false
          $states = [Collections.Generic.List[object]]::new()
          try {
            do {
              $p.Refresh()
              if ($p.HasExited) { throw "EXE exited during startup: $($p.ExitCode)" }
              $states.Add(@{elapsedMs=$watch.ElapsedMilliseconds; handle=$p.MainWindowHandle.ToInt64(); title=$p.MainWindowTitle})
              if ($p.MainWindowHandle -ne 0 -and $p.MainWindowTitle -like '*MyLovePixel*') { $ready = $true; break }
              Start-Sleep -Milliseconds 200
            } while ($watch.ElapsedMilliseconds -lt 20000)
            if (-not $ready) { throw 'Main window did not become ready within the startup deadline' }
            Write-Output "Native window ready after $($watch.ElapsedMilliseconds) ms: $($p.MainWindowTitle)"
            if (-not $p.WaitForInputIdle(10000)) { throw 'Main window message loop did not become responsive' }
            if (-not $p.CloseMainWindow()) { throw 'Main window rejected the normal close message' }
            if (-not $p.WaitForExit(15000) -or $p.ExitCode -ne 0) { throw 'EXE did not close normally' }
            Write-Output 'Native startup and normal shutdown passed; exit code 0'
          } finally {
            $states | ConvertTo-Json -Depth 4 | Set-Content artifacts/checks/native-startup.json
            $crash = Join-Path $env:LOCALAPPDATA 'MyLovePixel/crash.log'
            if (Test-Path $crash) { Copy-Item $crash artifacts/checks/native-crash.log; Get-Content $crash -Tail 60 }
            if (-not $p.HasExited) { $p.Kill() }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MyLovePixel-Smooth-win64
          path: artifacts/windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MyLovePixel-Smooth-checks
          path: |
            artifacts/checks/
            artifacts/ux/
            artifacts/source.zip
          if-no-files-found: ignore
