name: UX Source Snapshot
on:
  push:
    branches: [ux-release-p0-p1-20260926]
    paths: ['.github/workflows/ux-source.yml']
permissions:
  actions: read
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyLovePixel-toolchain-slim
          run-id: 36216873775
          repository: LaooooB/MyLovePixel
          github-token: ${{ github.token }}
          path: /tmp/tooling
      - name: Split transfer archive
        run: split -b 400m /tmp/tooling/MyLovePixel-toolchain-slim.tar.gz /tmp/mlpx-toolchain.part-
      - uses: actions/upload-artifact@v4
        with:
          name: MyLovePixel-tools-a
          path: /tmp/mlpx-toolchain.part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MyLovePixel-tools-b
          path: /tmp/mlpx-toolchain.part-ab
          compression-level: 0
          retention-days: 1
